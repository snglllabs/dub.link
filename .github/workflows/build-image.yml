name: build-image

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".github/**"
  workflow_dispatch:

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/snglllabs/dub.link:latest
            ghcr.io/snglllabs/dub.link:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_APP_DOMAIN=short.sngll.org
            NEXT_PUBLIC_APP_SHORT_DOMAIN=short.sngll.org
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=pk_test_placeholder
            NEXT_PUBLIC_STORAGE_BASE_URL=https://storage.silo.sngll.org/dubassets
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Optional: set repo secret DOKPLOY_DEPLOY_WEBHOOK to make deploys automatic.
      - name: Trigger Dokploy deploy
        continue-on-error: true
        env:
          DOKPLOY_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
        run: |
          if [ -n "$DOKPLOY_DEPLOY_WEBHOOK" ]; then
            curl -fsS -X POST "$DOKPLOY_DEPLOY_WEBHOOK"
          else
            echo "DOKPLOY_DEPLOY_WEBHOOK not set; skipping (image pushed, deploy manually in Dokploy)."
          fi
